        <>
        <script type="text/javascript" charset="utf-8">
                var holder = document.getElementById("holder");
                var chartWidth = holder.clientWidth;
                var chartHeight = holder.clientHeight;
                var r = Raphael("holder", chartWidth, chartHeight);
                    txtattr = { font: "12px 'Fontin Sans', Fontin-Sans, sans-serif" };
                
                var x = [], y = [];

                var xhr = {};
                if (window.XMLHttpRequest) {
                    //Firefox, Opera, IE7, and other browsers will use the native object
                    xhr.new = function () { return new XMLHttpRequest(); };
                } else {
                    //IE 5 and 6 will use the ActiveX control
                    xhr.new = function () { return new ActiveXObject("Microsoft.XMLHTTP"); };
                }
                var req = xhr.new();
                req.open("GET", "data.json", false);
                req.send();
                var jsonData = req.responseText;
                var data = eval(jsonData);
                var length = data.length;
                console.log(data);
                for (var i = 0; i < length; i++) {
                    x[i] = data[i][0];
                    y[i] = data[i][1];
                }

                var lines = r.linechart(38, 24, chartWidth - 68, chartHeight - 58,
                    y, x,
                    { nostroke: false, axis: "0 0 1 1", symbol: "circle", smooth: true,
                        colors: ["#a6e22e"] }).hoverColumn(function () {
                        this.tags = r.set();

                        for (var i = 0, ii = this.y.length; i < ii; i++) {
                            this.tags.push(r.tag(this.x, this.y[i], this.values[i], 160, 10).insertBefore(this).attr([{ fill: "#f8f8f2" }, { fill: "#a6e22e" }]));
                        }
                }, function () {
                    this.tags && this.tags.remove();
                });
                //lines.click(function () { console.log("Clock! ... " + this.toString()) });
                // lines.onClick);
                lines.symbols.attr({ r: 6 })
            };
        </script>
    </head>
    <body class="raphael" id="">
        <main class="page-shell">
            <h1>Runtime metrics</h1>
            <div id="holder" role="img" aria-label="Runtime metrics line chart"></div>
        </main>
    </body>
</html>
